services:
  relay:
    build: .
    restart: unless-stopped
    environment:
      BIND_HOST: 0.0.0.0
      PORT: 8080
    expose:
      - "8080"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:?Set RELAY_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
