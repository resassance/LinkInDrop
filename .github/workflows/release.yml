name: Publish verified builds
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Build run ID
        required: true
      tag:
        description: Existing release tag
        required: true
        default: v0.3.0-alpha.4
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/github-script@v7
        env:
          BUILD_RUN: ${{ inputs.run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const run_id = Number(process.env.BUILD_RUN);
            const tag = process.env.RELEASE_TAG;
            const {data: run} = await github.rest.actions.getWorkflowRun({owner, repo, run_id});
            if (run.conclusion !== 'success' || run.name !== 'Build' || run.head_branch !== 'main') {
              throw new Error('Build must have passed on main');
            }
            const {data: release} = await github.rest.repos.getReleaseByTag({owner, repo, tag});
            if (!release.prerelease) throw new Error('Expected an alpha release');
            const {data: ref} = await github.rest.git.getRef({owner, repo, ref: `tags/${tag}`});
            let target = ref.object;
            while (target.type === 'tag') {
              const {data: annotated} = await github.rest.git.getTag({owner, repo, tag_sha: target.sha});
              target = annotated.object;
            }
            if (target.type !== 'commit' || target.sha !== run.head_sha) {
              throw new Error('Release source differs from the verified build');
            }
            const {data: artifacts} = await github.rest.actions.listWorkflowRunArtifacts({owner, repo, run_id});
            for (const name of ['linkindrop-android', 'linkindrop-linux', 'linkindrop-windows']) {
              if (!artifacts.artifacts.some(item => item.name === name && !item.expired)) {
                throw new Error(`Missing ${name}`);
              }
            }
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          pattern: linkindrop-*
          path: dist
          merge-multiple: true
      - name: Verify packaged checksums
        working-directory: dist
        run: sha256sum --check *.sha256
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: dist/*
          fail_on_unmatched_files: true
          draft: true
