name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-2022
            platform: windows
          - os: ubuntu-24.04
            platform: android
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build libgtk-3-dev liblzma-dev
      - run: python tool/bootstrap.py
      - run: flutter pub get
      - if: matrix.platform == 'linux'
        run: flutter build linux --release
      - if: matrix.platform == 'windows'
        run: flutter build windows --release
      - if: matrix.platform == 'android'
        run: flutter build apk --release --target-platform android-arm64,android-arm,android-x64
      - run: python tool/package.py ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: nearbridge-${{ matrix.platform }}
          path: dist/*
          retention-days: 14
